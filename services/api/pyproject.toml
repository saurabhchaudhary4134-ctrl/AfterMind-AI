[project]
name = "aftermind-api"
version = "0.1.0"
description = "AfterMind AI — decision-intelligence platform backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "sqlalchemy==2.1.6",
    "alembic==1.20.1",
    "psycopg2-binary==2.9.10",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==5.0.0",
    "pyjwt==2.15.1",
    "python-multipart==0.0.32",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "pandas==3.1.0",
    "scikit-learn==1.9.1",
    "celery==5.4.0",
    "redis==8.1.0",
    "httpx==0.28.1",
    "simpleeval==1.0.8",
    "email-validator==2.3.0",
    "starlette==1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
